plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = '21.0.5'
    modules = [ 'javafx.controls' ]
}

// Project settings
group = 'com.spaceinvaders'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Code coverage with Jacoco
apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.14'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// Application configuration
application {
    mainClass = 'com.spaceinvaders.SpaceInvadersGame'
}

// Allow JavaFX's glass native loader under newer JDKs (removes JNI warning)
tasks.named('run') {
    jvmArguments = ['--enable-native-access=javafx.graphics']
}

// Testing tasks
test {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}

// Fails the build when coverage drops below target (see README for the report)
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.80
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
